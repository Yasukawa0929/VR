<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="utf-8">
    <title>ストリートビュー風パノラマ VR対応版（シナリオ選択機能付き）</title>
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
    <style>
        body { margin: 0; padding: 0; overflow: hidden; font-family: sans-serif; }
        .a-loader-title { display: none !important; }
        
        /* シナリオ選択メニューのスタイル */
        #start-menu {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: rgba(0, 0, 0, 0.8);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            color: white;
        }
        #start-menu h1 {
            font-size: 24px;
            margin-bottom: 30px;
        }
        .scenario-btn {
            background-color: #333;
            color: white;
            border: 2px solid white;
            padding: 15px 40px;
            margin: 10px;
            font-size: 18px;
            border-radius: 8px;
            cursor: pointer;
            transition: 0.3s;
            width: 300px;
        }
        .scenario-btn:hover {
            background-color: white;
            color: black;
        }
        .scenario-btn.fire {
            border-color: #ff4444;
        }
        .scenario-btn.fire:hover {
            background-color: #ff4444;
            color: white;
        }
        .scenario-btn.tsunami {
            border-color: #4488ff;
        }
        .scenario-btn.tsunami:hover {
            background-color: #4488ff;
            color: white;
        }

        /* 画面上部のメッセージUI */
        #mission-ui {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            color: white;
            padding: 15px 30px;
            font-size: 20px;
            font-weight: bold;
            border-radius: 8px;
            border: 2px solid white;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            z-index: 9000;
            display: none;
            pointer-events: none;
            text-align: center;
        }
    </style>
</head>
<body>

    <!-- シナリオ選択画面 -->
    <div id="start-menu">
        <h1>体験するシナリオを選択してください</h1>
        <button class="scenario-btn" onclick="startScenario('normal')">シナリオ1：通常時</button>
        <button class="scenario-btn fire" onclick="startScenario('fire')">シナリオ2：火災発生時</button>
        <button class="scenario-btn tsunami" onclick="startScenario('tsunami')">シナリオ3：津波発生時</button>
    </div>

    <!-- 画面上部の指示メッセージ -->
    <div id="mission-ui"></div>

    <!-- VR空間 -->
    <a-scene cursor="rayOrigin: mouse">
        <!-- SVGの矢印はVRでのバグの原因になるため削除し、JS内でCanvasとして生成します -->
        <a-assets></a-assets>

        <a-sky id="sky" src="" rotation="0 180 0" animation__fade="property: material.opacity; from: 0; to: 1; dur: 500; startEvents: sceneloaded"></a-sky>

        <a-entity id="hotspots"></a-entity>

        <a-entity id="rig">
            <a-camera id="camera" position="0 1.6 0" look-controls="reverseMouseDrag: true">
                <a-entity cursor="fuse: false"
                          position="0 0 -1"
                          geometry="primitive: ring; radiusInner: 0.02; radiusOuter: 0.03"
                          material="color: white; shader: flat; opacity: 0.5"
                          raycaster="objects: .clickable">
                </a-entity>
            </a-camera>
            <a-entity laser-controls="hand: right" raycaster="objects: .clickable; far: 20"></a-entity>
            <a-entity laser-controls="hand: left" raycaster="objects: .clickable; far: 20"></a-entity>
        </a-entity>
    </a-scene>

    <script>
        let currentScenario = 'normal';

        const commonData = {
            "scene55": { "panorama": "left_image55.JPG", "hotSpots": [{ "rotX": -9.67, "rotY": -87.11, "text": "教室前通路", "sceneId": "scene66" }] },
            "scene66": { "panorama": "left_image66.JPG", "hotSpots": [{ "rotX": -17.14, "rotY": -28.62, "text": "3階非常階段", "sceneId": "scene35" }, { "rotX": -14.73, "rotY": 86.68, "text": "教室", "sceneId": "scene55" }, { "rotX": -3.00, "rotY": -183.73, "text": "3階通路1", "sceneId": "scene57" }] },
            "scene57": { "panorama": "left_image57.JPG", "hotSpots": [{ "rotX": -1.84, "rotY": -183.19, "text": "3階通路2", "sceneId": "scene60" }, { "rotX": -8.77, "rotY": -4.28, "text": "教室前通路", "sceneId": "scene66" }] },
            "scene60": { "panorama": "left_image60.JPG", "hotSpots": [{ "rotX": -2.25, "rotY": -190.72, "text": "3階階段", "sceneId": "scene61" }, { "rotX": -4.90, "rotY": -12.63, "text": "3階通路1", "sceneId": "scene57" }] },
            "scene61": { "panorama": "left_image61.JPG", "hotSpots": [
                { "rotX": -13.42, "rotY": -250.27, "text": "2-3階踊り場", "sceneId": "scene54" },
                { "rotX": -1.45, "rotY": -5.89, "text": "3階通路2", "sceneId": "scene60" }
            ]},
            "scene54": { "panorama": "left_image54.JPG", "hotSpots": [
                { "rotX": -35.86, "rotY": -59.84, "text": "2階階段", "sceneId": "scene53" },
                { "rotX": -20.85, "rotY": -122.60, "text": "3階階段", "sceneId": "scene61" }
            ]},
            "scene53": { "panorama": "left_image53.JPG", "hotSpots": [
                { "rotX": -20.70, "rotY": -259.21, "text": "1-2階踊り場", "sceneId": "scene52" },
                { "rotX": -9.88, "rotY": 67.54, "text": "2-3階踊り場", "sceneId": "scene54" }
            ]},
            "scene52": { "panorama": "left_image52.JPG", "hotSpots": [
                { "rotX": -35.63, "rotY": -58.50, "text": "1階階段", "sceneId": "scene51" },
                { "rotX": -16.34, "rotY": -117.38, "text": "2階階段", "sceneId": "scene53" }
            ]},
            "scene51": { "panorama": "left_image51.JPG", "hotSpots": [
                { "rotX": -10.00, "rotY": -258.30, "text": "朝礼台前通路", "sceneId": "scene19" },
                { "rotX": -4.55, "rotY": 73.94, "text": "1-2階踊り場", "sceneId": "scene52" },
                { "rotX": -7.67, "rotY": -1.27, "text": "未準備通路１（準備中）" } 
            ]},
            "scene19": { "panorama": "left_image19.JPG", "hotSpots": [
                { "rotX": 0.07, "rotY": -269.51, "text": "運動場", "sceneId": "scene62" },
                { "rotX": -5.18, "rotY": -103.61, "text": "1階階段", "sceneId": "scene51" },
                { "rotX": -5.46, "rotY": -182.02, "text": "未準備通路２（準備中）" }, 
                { "rotX": -1.18, "rotY": -1.46, "text": "未準備通路３（準備中）" } 
            ]},
            "scene35": { "panorama": "left_image35.JPG", "hotSpots": [{ "rotX": -31.88, "rotY": -141.44, "text": "2階-3階_踊り場", "sceneId": "scene34" }, { "rotX": -17.54, "rotY": 85.21, "text": "教室前通路", "sceneId": "scene66" }] },
            "scene34": { "panorama": "left_image34.JPG", "hotSpots": [{ "rotX": -31.63, "rotY": 23.61, "text": "2階非常階段", "sceneId": "scene33" }, { "rotX": -20.91, "rotY": -22.37, "text": "3階非常階段", "sceneId": "scene35" }] },
            "scene33": { "panorama": "left_image33.JPG", "hotSpots": [{ "rotX": -29.50, "rotY": -138.92, "text": "1-2階_踊り場", "sceneId": "scene32" }, { "rotX": -14.21, "rotY": -188.65, "text": "2階-3階_踊り場", "sceneId": "scene34" }, { "rotX": -25.37, "rotY": 88.55, "text": "2階内部（準備中）" }] },
            "scene32": { "panorama": "left_image32.JPG", "hotSpots": [{ "rotX": -32.01, "rotY": 33.03, "text": "1階非常階段前", "sceneId": "scene31" }, { "rotX": -25.00, "rotY": -22.10, "text": "2階非常階段", "sceneId": "scene33" }] },
            "scene31": { "panorama": "left_image31.JPG", "hotSpots": [{ "rotX": -3.54, "rotY": -89.46, "text": "駐車場1", "sceneId": "scene36" }, { "rotX": -6.19, "rotY": -190.17, "text": "1-2階_踊り場", "sceneId": "scene32" }, { "rotX": -20.72, "rotY": 86.69, "text": "1階内部（準備中）" }] },
            "scene36": { "panorama": "left_image36.JPG", "hotSpots": [{ "rotX": -12.05, "rotY": -87.92, "text": "駐車場2", "sceneId": "scene37" }, { "rotX": -16.92, "rotY": -267.44, "text": "1階非常階段前", "sceneId": "scene31" }] },
            "scene37": { "panorama": "left_image37.JPG", "hotSpots": [{ "rotX": -2.70, "rotY": -14.84, "text": "駐車場3", "sceneId": "scene38" }, { "rotX": -15.92, "rotY": -180.33, "text": "駐車場1", "sceneId": "scene36" }] },
            "scene38": { "panorama": "left_image38.JPG", "hotSpots": [{ "rotX": -3.46, "rotY": -0.15, "text": "学校入口", "sceneId": "scene39" }, { "rotX": -6.45, "rotY": -182.71, "text": "駐車場2", "sceneId": "scene37" }] },
            "scene39": { "panorama": "left_image39.JPG", "hotSpots": [{ "rotX": -5.87, "rotY": 83.42, "text": "通路1", "sceneId": "scene40" }, { "rotX": -8.45, "rotY": -166.17, "text": "駐車場3", "sceneId": "scene38" }] },
            "scene40": { "panorama": "left_image40.JPG", "hotSpots": [{ "rotX": -2.59, "rotY": 85.07, "text": "通路2", "sceneId": "scene4" }, { "rotX": -2.69, "rotY": -82.27, "text": "学校入口", "sceneId": "scene39" }, { "rotX": -6.51, "rotY": -187.08, "text": "校舎入口（準備中）" }] },
            "scene4": { "panorama": "left_image4.JPG", "hotSpots": [{ "rotX": -4.83, "rotY": -254.15, "text": "運動場", "sceneId": "scene62" }, { "rotX": -3.27, "rotY": -91.29, "text": "通路1", "sceneId": "scene40" }, { "rotX": -3.76, "rotY": -181.98, "text": "通路3（準備中）" }, { "rotX": -6.98, "rotY": -4.37, "text": "体育館前通路（準備中）" }] },
            "scene62": { "panorama": "left_image62.JPG", "hotSpots": [
                { "rotX": 5.20, "rotY": -33.61, "text": "通路2", "sceneId": "scene4" }, 
                { "rotX": 6.18, "rotY": -90.06, "text": "中央通路（準備中）" }, 
                { "rotX": 7.09, "rotY": -118.72, "text": "朝礼台前通路", "sceneId": "scene19" } 
            ]}
        };

        const fireData = JSON.parse(JSON.stringify(commonData));
        fireData["scene66"].panorama = "fire_image66.JPG";
        fireData["scene57"].panorama = "fire_image57.JPG";
        fireData["scene60"].panorama = "fire_image60.JPG";
        fireData["scene61"].panorama = "fire_image61.JPG";

        const tsunamiData = JSON.parse(JSON.stringify(commonData));

        const scenarioData = {
            normal: JSON.parse(JSON.stringify(commonData)),
            fire: fireData,
            tsunami: tsunamiData
        };

        function startScenario(scenarioName) {
            currentScenario = scenarioName;
            document.getElementById('start-menu').style.display = 'none';

            const cameraEl = document.getElementById('camera');
            if (cameraEl && cameraEl.components['look-controls']) {
                cameraEl.components['look-controls'].pitchObject.rotation.x = 0;
                cameraEl.components['look-controls'].yawObject.rotation.y = 0;

                if (scenarioName === 'tsunami') {
                    cameraEl.components['look-controls'].yawObject.rotation.y = Math.PI / 2;
                }
            }

            if (scenarioName === 'tsunami') {
                loadScene('scene62');
            } else {
                loadScene('scene55');
            }
        }

        // 看板のテキスト画像を生成
        function createJapaneseTextTexture(text) {
            const canvas = document.createElement('canvas');
            canvas.width = 512;
            canvas.height = 128;
            const ctx = canvas.getContext('2d');
            
            ctx.fillStyle = 'rgba(0, 0, 0, 0.5)';
            ctx.roundRect ? ctx.roundRect(0, 0, 512, 128, 20) : ctx.fillRect(0, 0, 512, 128);
            ctx.fill();

            ctx.fillStyle = 'white';
            ctx.font = 'bold 44px sans-serif';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText(text, 256, 64);
            
            return canvas.toDataURL();
        }

        // 矢印の画像を生成（SVGをやめてCanvasで描画することでVRでの透過バグを回避）
        function createArrowTexture() {
            const canvas = document.createElement('canvas');
            canvas.width = 256;
            canvas.height = 256;
            const ctx = canvas.getContext('2d');

            ctx.fillStyle = 'rgba(255, 255, 255, 0.3)';
            ctx.strokeStyle = 'black';
            ctx.lineWidth = 8;
            ctx.beginPath();
            ctx.arc(128, 128, 110, 0, Math.PI * 2);
            ctx.fill();
            ctx.stroke();

            ctx.lineWidth = 14;
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';
            ctx.beginPath();
            ctx.moveTo(128, 180);
            ctx.lineTo(128, 76);
            ctx.stroke();

            ctx.beginPath();
            ctx.moveTo(86, 118);
            ctx.lineTo(128, 76);
            ctx.lineTo(170, 118);
            ctx.stroke();

            return canvas.toDataURL();
        }

        function loadScene(sceneId) {
            const sceneData = scenarioData[currentScenario][sceneId];
            if (!sceneData) return;

            const missionUi = document.getElementById('mission-ui');
            
            if (currentScenario === 'fire' && sceneId === 'scene55') {
                missionUi.innerText = "資料室で火災発生！運動場まで避難しよう！";
                missionUi.style.backgroundColor = "rgba(220, 0, 0, 0.85)";
                missionUi.style.display = 'block';
            } else if (currentScenario === 'tsunami' && sceneId === 'scene62') {
                missionUi.innerText = "津波発生！校舎3階に避難しよう！";
                missionUi.style.backgroundColor = "rgba(0, 80, 220, 0.85)";
                missionUi.style.display = 'block';
            } else {
                missionUi.style.display = 'none';
            }

            const sky = document.getElementById('sky');
            sky.setAttribute('src', sceneData.panorama);
            sky.emit('sceneloaded');

            const hotspotContainer = document.getElementById('hotspots');
            hotspotContainer.innerHTML = '';

            sceneData.hotSpots.forEach(spot => {
                const wrapper = document.createElement('a-entity');
                wrapper.setAttribute('rotation', `${spot.rotX} ${spot.rotY} 0`);
                // VRモードに入った時にカメラ位置が高くなりすぎて矢印が見切れるのを防止
                wrapper.setAttribute('position', '0 1.6 0'); 

                const arrow = document.createElement('a-image');
                arrow.setAttribute('src', createArrowTexture());
                arrow.setAttribute('position', '0 0.5 -6');
                arrow.setAttribute('width', '1');
                arrow.setAttribute('height', '1');
                // VR空間でのアルファテスト（透過バグ）防止
                arrow.setAttribute('material', 'transparent: true; alphaTest: 0.1');
                
                if (spot.sceneId) {
                    arrow.setAttribute('class', 'clickable');
                    arrow.setAttribute('opacity', '0.6');
                    
                    arrow.addEventListener('click', () => {
                        loadScene(spot.sceneId);
                    });
                    
                    arrow.addEventListener('mouseenter', () => {
                        arrow.setAttribute('scale', '1.3 1.3 1.3');
                        arrow.setAttribute('opacity', '1.0');
                    });
                    
                    arrow.addEventListener('mouseleave', () => {
                        arrow.setAttribute('scale', '1 1 1');
                        arrow.setAttribute('opacity', '0.6');
                    });
                } else {
                    arrow.setAttribute('opacity', '0.3');
                }

                const textLabel = document.createElement('a-image');
                textLabel.setAttribute('src', createJapaneseTextTexture(spot.text));
                textLabel.setAttribute('position', '0 -0.5 -6');
                textLabel.setAttribute('width', '2.5');
                textLabel.setAttribute('height', '0.625');
                // テキスト看板のVR空間でのアルファテスト（透過バグ）防止
                textLabel.setAttribute('material', 'transparent: true; alphaTest: 0.1');

                wrapper.appendChild(arrow);
                wrapper.appendChild(textLabel);
                hotspotContainer.appendChild(wrapper);
            });
        }
    </script>
</body>
</html>
