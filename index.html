<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="utf-8">
    <title>ストリートビュー風パノラマ VR対応版（シナリオ選択機能付き）</title>
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
    <style>
        body { margin: 0; padding: 0; overflow: hidden; font-family: sans-serif; }
        .a-loader-title { display: none !important; }
        
        /* シナリオ選択メニューのスタイル */
        #start-menu {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: rgba(0, 0, 0, 0.8);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            color: white;
        }
        #start-menu h1 {
            font-size: 24px;
            margin-bottom: 30px;
        }
        .scenario-btn {
            background-color: #333;
            color: white;
            border: 2px solid white;
            padding: 15px 40px;
            margin: 10px;
            font-size: 18px;
            border-radius: 8px;
            cursor: pointer;
            transition: 0.3s;
            width: 300px;
        }
        .scenario-btn:hover {
            background-color: white;
            color: black;
        }
        .scenario-btn.fire {
            border-color: #ff4444;
        }
        .scenario-btn.fire:hover {
            background-color: #ff4444;
            color: white;
        }
        .scenario-btn.tsunami {
            border-color: #4488ff;
        }
        .scenario-btn.tsunami:hover {
            background-color: #4488ff;
            color: white;
        }

        /* 画面上部のメッセージUI */
        #mission-ui {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            color: white;
            padding: 15px 30px;
            font-size: 20px;
            font-weight: bold;
            border-radius: 8px;
            border: 2px solid white;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            z-index: 9000;
            display: none;
            pointer-events: none;
            text-align: center;
        }
    </style>
</head>
<body>

    <!-- シナリオ選択画面 -->
    <div id="start-menu">
        <h1>体験するシナリオを選択してください</h1>
        <button class="scenario-btn" onclick="startScenario('normal')">シナリオ1：通常時</button>
        <button class="scenario-btn fire" onclick="startScenario('fire')">シナリオ2：火災発生時</button>
        <button class="scenario-btn tsunami" onclick="startScenario('tsunami')">シナリオ3：津波発生時</button>
    </div>

    <!-- 画面上部の指示メッセージ -->
    <div id="mission-ui"></div>

    <!-- VR空間 -->
    <a-scene cursor="rayOrigin: mouse">
        <a-assets></a-assets>

        <!-- 背景画像 -->
        <a-sky id="sky" src="" rotation="0 180 0" animation__fade="property: material.opacity; from: 0; to: 1; dur: 500; startEvents: sceneloaded"></a-sky>

        <a-entity id="hotspots"></a-entity>

        <a-entity id="rig">
            <a-camera id="camera" position="0 1.6 0" look-controls="reverseMouseDrag: true">
                <a-entity cursor="fuse: false"
                          position="0 0 -1"
                          geometry="primitive: ring; radiusInner: 0.02; radiusOuter: 0.03"
                          material="color: white; shader: flat; opacity: 0.5"
                          raycaster="objects: .clickable">
                </a-entity>
            </a-camera>
            <a-entity laser-controls="hand: right" raycaster="objects: .clickable; far: 20"></a-entity>
            <a-entity laser-controls="hand: left" raycaster="objects: .clickable; far: 20"></a-entity>
        </a-entity>
    </a-scene>

    <script>
        let currentScenario = 'normal';

        // ★ 方角の全体調整用パラメータ（度単位）
        // マイナスの値で右回転、プラスの値で左回転になります。
        // （例: -90 = 右に90度ずらす / 90 = 左に90度ずらす）
        const yawOffset = -90; 

        // 座標データ（元の数値のまま変更しなくて大丈夫です）
        const commonData = {
            "scene1": {
                "panorama": "1.JPG",
                "hotSpots": [
                    { "rotX": -11.61, "rotY": -175.17, "text": "部屋内" }, 
                    { "rotX": -10.12, "rotY": -90.30, "text": "バルコニー" },
                    { "rotX": -13.40, "rotY": 66.04, "text": "階段側", "sceneId": "scene2" }
                ]
            },
            "scene2": {
                "panorama": "2.JPG",
                "hotSpots": [
                    { "rotX": -21.30, "rotY": 40.47, "text": "階段側", "sceneId": "scene3" },
                    { "rotX": -15.01, "rotY": -122.70, "text": "4402前", "sceneId": "scene1" }
                ]
            },
            "scene3": {
                "panorama": "3.JPG",
                "hotSpots": [
                    { "rotX": -14.98, "rotY": 18.65, "text": "4-5階踊り場" },
                    { "rotX": -14.98, "rotY": -11.45, "text": "3-4階踊り場", "sceneId": "scene4" },
                    { "rotX": -17.30, "rotY": 92.09, "text": "4403前" },
                    { "rotX": -9.80, "rotY": -126.02, "text": "4階エレベーター前1", "sceneId": "scene2" }
                ]
            },
            "scene4": {
                "panorama": "4.JPG",
                "hotSpots": [
                    { "rotX": -10.80, "rotY": -154.52, "text": "4階階段", "sceneId": "scene3" },
                    { "rotX": -33.41, "rotY": 168.37, "text": "3階階段", "sceneId": "scene5" }
                ]
            },
            "scene5": {
                "panorama": "5.JPG",
                "hotSpots": [
                    { "rotX": -14.98, "rotY": 18.65, "text": "3-4階踊り場", "sceneId": "scene4" },
                    { "rotX": -14.98, "rotY": -11.45, "text": "2-3階踊り場" },
                    { "rotX": -19.01, "rotY": -161.48, "text": "3階エレベーター前" }
                ]
            }
        };

        const scenarioData = {
            normal: JSON.parse(JSON.stringify(commonData)),
            fire: JSON.parse(JSON.stringify(commonData)),
            tsunami: JSON.parse(JSON.stringify(commonData))
        };

        function startScenario(scenarioName) {
            currentScenario = scenarioName;
            document.getElementById('start-menu').style.display = 'none';

            const cameraEl = document.getElementById('camera');
            if (cameraEl && cameraEl.components['look-controls']) {
                cameraEl.components['look-controls'].pitchObject.rotation.x = 0;
                
                // ★ スタート時のカメラの向きを yawOffset に合わせてずらす
                cameraEl.components['look-controls'].yawObject.rotation.y = yawOffset * (Math.PI / 180);
            }

            // シナリオに関わらず、全て1.JPGからスタートする
            loadScene('scene1');
        }

        function createJapaneseTextTexture(text) {
            const canvas = document.createElement('canvas');
            canvas.width = 512;
            canvas.height = 128;
            const ctx = canvas.getContext('2d');
            
            ctx.fillStyle = 'rgba(0, 0, 0, 0.5)';
            ctx.roundRect ? ctx.roundRect(0, 0, 512, 128, 20) : ctx.fillRect(0, 0, 512, 128);
            ctx.fill();

            ctx.fillStyle = 'white';
            ctx.font = 'bold 44px sans-serif';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText(text, 256, 64);
            
            return canvas.toDataURL();
        }

        function createArrowTexture() {
            const canvas = document.createElement('canvas');
            canvas.width = 256;
            canvas.height = 256;
            const ctx = canvas.getContext('2d');

            ctx.fillStyle = 'rgba(255, 255, 255, 0.3)';
            ctx.strokeStyle = 'black';
            ctx.lineWidth = 8;
            ctx.beginPath();
            ctx.arc(128, 128, 110, 0, Math.PI * 2);
            ctx.fill();
            ctx.stroke();

            ctx.lineWidth = 14;
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';
            ctx.beginPath();
            ctx.moveTo(128, 180);
            ctx.lineTo(128, 76);
            ctx.stroke();

            ctx.beginPath();
            ctx.moveTo(86, 118);
            ctx.lineTo(128, 76);
            ctx.lineTo(170, 118);
            ctx.stroke();

            return canvas.toDataURL();
        }

        function loadScene(sceneId) {
            const sceneData = scenarioData[currentScenario][sceneId];
            if (!sceneData) return;

            const missionUi = document.getElementById('mission-ui');
            
            if (currentScenario === 'fire' && sceneId === 'scene1') {
                missionUi.innerText = "火災発生！直ちに避難しよう！";
                missionUi.style.backgroundColor = "rgba(220, 0, 0, 0.85)";
                missionUi.style.display = 'block';
            } else if (currentScenario === 'tsunami' && sceneId === 'scene1') {
                missionUi.innerText = "津波発生！高層階に避難しよう！";
                missionUi.style.backgroundColor = "rgba(0, 80, 220, 0.85)";
                missionUi.style.display = 'block';
            } else {
                missionUi.style.display = 'none';
            }

            const sky = document.getElementById('sky');
            sky.setAttribute('src', sceneData.panorama);
            sky.emit('sceneloaded');

            const hotspotContainer = document.getElementById('hotspots');
            hotspotContainer.innerHTML = '';

            sceneData.hotSpots.forEach(spot => {
                const wrapper = document.createElement('a-entity');
                
                // ★ 矢印を配置する際にも yawOffset の角度を足してずらす
                wrapper.setAttribute('rotation', `${spot.rotX} ${spot.rotY + yawOffset} 0`);
                wrapper.setAttribute('position', '0 1.6 0'); 

                const arrow = document.createElement('a-image');
                arrow.setAttribute('src', createArrowTexture());
                arrow.setAttribute('position', '0 0.5 -6');
                arrow.setAttribute('width', '1');
                arrow.setAttribute('height', '1');
                arrow.setAttribute('material', 'transparent: true; alphaTest: 0.1');
                
                if (spot.sceneId) {
                    arrow.setAttribute('class', 'clickable');
                    arrow.setAttribute('opacity', '0.6');
                    
                    arrow.addEventListener('click', () => {
                        loadScene(spot.sceneId);
                    });
                    
                    arrow.addEventListener('mouseenter', () => {
                        arrow.setAttribute('scale', '1.3 1.3 1.3');
                        arrow.setAttribute('opacity', '1.0');
                    });
                    
                    arrow.addEventListener('mouseleave', () => {
                        arrow.setAttribute('scale', '1 1 1');
                        arrow.setAttribute('opacity', '0.6');
                    });
                } else {
                    arrow.setAttribute('opacity', '0.3');
                }

                const textLabel = document.createElement('a-image');
                textLabel.setAttribute('src', createJapaneseTextTexture(spot.text));
                textLabel.setAttribute('position', '0 -0.5 -6');
                textLabel.setAttribute('width', '2.5');
                textLabel.setAttribute('height', '0.625');
                textLabel.setAttribute('material', 'transparent: true; alphaTest: 0.1');

                wrapper.appendChild(arrow);
                wrapper.appendChild(textLabel);
                hotspotContainer.appendChild(wrapper);
            });
        }
    </script>
</body>
</html>
